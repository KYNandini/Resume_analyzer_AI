<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Analyser – Register / Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Montserrat', sans-serif;
}
.container {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  position: relative;
  overflow: hidden;
  width: 900px;
  max-width: 100%;
  min-height: 560px;
}
.form-container {
  position: absolute;
  top: 0;
  height: 100%;
  width: 50%;
  transition: all 0.6s ease-in-out;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sign-in-container { left: 0; z-index: 2; }
.sign-up-container { left: 0; opacity: 0; z-index: 1; }
.container.right-panel-active .sign-in-container { transform: translateX(100%); }
.container.right-panel-active .sign-up-container {
  transform: translateX(100%);
  opacity: 1;
  z-index: 5;
  animation: show 0.6s;
}
@keyframes show {
  0%, 49.99% { opacity: 0; z-index: 1; }
  50%, 100%  { opacity: 1; z-index: 5; }
}
form {
  background: #fff;
  display: flex;
  flex-direction: column;
  padding: 0 44px;
  width: 100%;
  align-items: center;
  text-align: center;
  gap: 10px;
}
form h1 { font-size: 1.6rem; font-weight: 800; color: #1a1a2e; margin-bottom: 4px; }
form span { font-size: 0.72rem; color: #999; letter-spacing: 0.02em; }
input {
  background: #f0f2f5;
  border: 1.5px solid transparent;
  border-radius: 8px;
  padding: 12px 16px;
  width: 100%;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.85rem;
  color: #333;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
}
input:focus {
  border-color: #2bbbad;
  box-shadow: 0 0 0 3px rgba(43,187,173,0.15);
}
button {
  margin-top: 8px;
  border-radius: 22px;
  border: none;
  padding: 12px 46px;
  background: linear-gradient(135deg, #2bbbad, #00a896);
  color: white;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: transform 0.2s, box-shadow 0.2s;
}
button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43,187,173,0.35); }
.ghost {
  background: transparent;
  border: 2px solid white;
  color: white;
  margin-top: 14px;
}
.ghost:hover { background: rgba(255,255,255,0.15); box-shadow: none; transform: translateY(-1px); }
form a { font-size: 0.76rem; color: #2bbbad; text-decoration: none; }
form a:hover { text-decoration: underline; }
.social-container { display: flex; justify-content: center; gap: 10px; margin: 4px 0; }
.social-container a {
  border: 1.5px solid #ddd;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 40px;
  width: 40px;
  color: #555;
  font-size: 15px;
  text-decoration: none;
  transition: all 0.25s;
}
.social-container a:hover { background: #2bbbad; color: white; border-color: #2bbbad; }
.overlay-container {
  position: absolute;
  top: 0;
  left: 50%;
  width: 50%;
  height: 100%;
  overflow: hidden;
  transition: transform 0.6s ease-in-out;
  z-index: 100;
}
.container.right-panel-active .overlay-container { transform: translateX(-100%); }
.overlay {
  background: linear-gradient(135deg, #2bbbad 0%, #0099b4 100%);
  position: relative;
  left: -100%;
  height: 100%;
  width: 200%;
  transform: translateX(0);
  transition: transform 0.6s ease-in-out;
}
.container.right-panel-active .overlay { transform: translateX(50%); }
.overlay-panel {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 48px;
  text-align: center;
  height: 100%;
  width: 50%;
  color: white;
}
.overlay-panel h1 { font-size: 1.55rem; font-weight: 800; margin: 14px 0 10px; }
.overlay-panel p { font-size: 0.82rem; line-height: 1.6; opacity: 0.9; }
.overlay-left { transform: translateX(-20%); transition: transform 0.6s ease-in-out; }
.overlay-right { right: 0; transform: translateX(0); transition: transform 0.6s ease-in-out; }
.container.right-panel-active .overlay-left { transform: translateX(0); }
.container.right-panel-active .overlay-right { transform: translateX(20%); }
.logo-fixed {
  position: absolute;
  top: 18px;
  left: 18px;
  width: 120px;
  height: auto;
  border-radius: 8px;
  z-index: 999;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="container" id="container">

  <img src="logo.png" class="logo-fixed" alt="Resume Analyser Logo">

  <!-- SIGN UP -->
  <div class="form-container sign-up-container">
    <form id="signUpForm">
      <h1>Create Account</h1>
      <div class="social-container">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-google-plus-g"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
      </div>
      <span>or use your email for registration</span>
      <input type="text" id="regName" placeholder="Name" />
      <input type="email" id="regEmail" placeholder="Email" />
      <input type="password" id="regPassword" placeholder="Password" />
      <button type="submit">Sign Up</button>
    </form>
  </div>

  <!-- SIGN IN -->
  <div class="form-container sign-in-container">
    <form id="signInForm">
      <h1>Sign in</h1>
      <div class="social-container">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-google-plus-g"></i></a>
        <a href="#"><i class="fab fa-linkedin-in"></i></a>
      </div>
      <span>or use your account</span>
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <a href="#">Forgot your password?</a>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <!-- OVERLAY -->
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Welcome Back!</h1>
        <p>To keep connected with us please login with your personal info</p>
        <button class="ghost" id="signIn" type="button">Sign In</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Hello, Friend!</h1>
        <p>Enter your personal details and start your journey with us</p>
        <button class="ghost" id="signUp" type="button">Sign Up</button>
      </div>
    </div>
  </div>

</div>

<script>
// PANEL TOGGLE
document.getElementById('signUp').addEventListener('click', () => {
    document.getElementById('container').classList.add("right-panel-active");
});
document.getElementById('signIn').addEventListener('click', () => {
    document.getElementById('container').classList.remove("right-panel-active");
});

// SIGN UP
document.getElementById('signUpForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value.trim();

    if (!name || name.length < 2)        { alert("Enter a valid name."); return; }
    if (!email || !email.includes("@"))  { alert("Enter a valid email."); return; }
    if (!password || password.length < 6){ alert("Password must be at least 6 characters."); return; }

    let users = JSON.parse(localStorage.getItem("users")) || [];
    if (users.find(u => u.email === email)) { alert("Email already registered. Please sign in."); return; }

    users.push({ name, email, password });
    localStorage.setItem("users", JSON.stringify(users));
    alert("Account created successfully! Please sign in.");
    document.getElementById('container').classList.remove("right-panel-active");
});

// SIGN IN
document.getElementById('signInForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) { alert("Enter email and password."); return; }

    let users = JSON.parse(localStorage.getItem("users")) || [];
    const user = users.find(u => u.email === email && u.password === password);

    if (user) {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("userName",  user.name);
        localStorage.setItem("userEmail", user.email);
        window.location.href = "../analysis-dashboard/index.html";
    } else {
        alert("Invalid email or password. Please try again.");
    }
});
</script>

</body>
</html>
